# Idle handling (runs as hypridle.service). Locking always goes through
# `loginctl lock-session` so wlogout, sleep and the keybind share one path.
# Note: Hyprland's Lua config makes `hyprctl dispatch` take a Lua expression.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1200 # 20 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1320 # 22 min: screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
