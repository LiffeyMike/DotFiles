# Generated by `theme` for {{ theme.name }}; edit ~/.config/theme, not this file.
[font]
normal.family = "{{ look.font }}"
size = {{ look.term_font_size }}

[window]
opacity = {{ look.term_opacity }}

[colors.primary]
background = "#{{ p.bg }}"
foreground = "#{{ p.fg }}"
dim_foreground = "#{{ p.subtext }}"

[colors.cursor]
text = "#{{ p.bg }}"
cursor = "#{{ term.cursor }}"

[colors.selection]
text = "#{{ p.fg }}"
background = "#{{ p.surface2 }}"

[colors.normal]
{% for c in ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"] %}
{{ c }} = "#{{ term[c] }}"
{% endfor %}

[colors.bright]
{% for c in ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"] %}
{{ c }} = "#{{ term["bright_" ~ c] }}"
{% endfor %}
