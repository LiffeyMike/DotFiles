# Generated by `theme` for {{ theme.name }}; edit ~/.config/theme, not this file.
[global]
    font = "{{ look.font }} {{ look.font_size }}"
    corner_radius = {{ look.ui_rounding }}
    frame_width = 2
    frame_color = "#{{ p.surface2 }}"

[urgency_low]
    background = "#{{ p.bg }}"
    foreground = "#{{ p.subtext }}"
    highlight = "#{{ p.accent2 }}"

[urgency_normal]
    background = "#{{ p.bg }}"
    foreground = "#{{ p.fg }}"
    frame_color = "#{{ p.accent }}"
    highlight = "#{{ p.accent }}, #{{ p.accent2 }}"

[urgency_critical]
    background = "#{{ p.bg }}"
    foreground = "#{{ p.fg }}"
    frame_color = "#{{ p.red }}"
    highlight = "#{{ p.red }}"
