# Generated by `theme` for {{ theme.name }}; edit ~/.config/theme, not this file.
# Included from ~/.config/ghostty/config.
font-family = "{{ look.font }}"
font-size = {{ look.term_font_size }}
background-opacity = {{ look.term_opacity }}

background = #{{ p.bg }}
foreground = #{{ p.fg }}
cursor-color = #{{ term.cursor }}
cursor-text = #{{ p.bg }}
selection-background = #{{ p.surface2 }}
selection-foreground = #{{ p.fg }}

{% for c in ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"] %}
palette = {{ loop.index0 }}=#{{ term[c] }}
{% endfor %}
{% for c in ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"] %}
palette = {{ loop.index0 + 8 }}=#{{ term["bright_" ~ c] }}
{% endfor %}
