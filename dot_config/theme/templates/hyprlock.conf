# Generated by `theme` for {{ theme.name }}; edit ~/.config/theme, not this file.
general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    rounding = {{ look.ui_rounding }}
    outer_color = rgb({{ p.accent }})
    inner_color = rgb({{ p.bg }})
    font_color = rgb({{ p.fg }})
    check_color = rgb({{ p.yellow }})
    fail_color = rgb({{ p.red }})
    capslock_color = rgb({{ p.orange }})
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb({{ p.fg }})
    font_size = 90
    font_family = {{ look.font }}
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb({{ p.subtext }})
    font_size = 20
    font_family = {{ look.font }}
    position = 0, 30
    halign = center
    valign = center
}
