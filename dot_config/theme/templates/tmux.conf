# Generated by `theme` for {{ theme.name }}; edit ~/.config/theme, not this file.
# Sourced at the end of ~/.config/tmux/tmux.conf, and re-sourced by `theme` on every switch.
set -g status-style "bg=#{{ p.bg_alt }},fg=#{{ p.subtext }}"
set -g status-left-length 40
# Session name; switches to the second accent colour while the prefix key is held.
set -g status-left "#{?client_prefix,#[bg=#{{ p.accent2 }}],#[bg=#{{ p.accent }}]}#[fg=#{{ p.bg_dark }},bold] #S #[default] "

set -g window-status-separator ""
set -g window-status-format "#[fg=#{{ p.overlay }}] #I #[fg=#{{ p.subtext }}]#W "
set -g window-status-current-format "#[bg=#{{ p.surface0 }},fg=#{{ p.accent }},bold] #I #[fg=#{{ p.fg }}]#W "
set -g window-status-activity-style "fg=#{{ p.yellow }}"
set -g window-status-bell-style "fg=#{{ p.red }}"

set -g pane-border-style "fg=#{{ p.surface1 }}"
set -g pane-active-border-style "fg=#{{ p.accent }}"
set -g display-panes-colour "#{{ p.overlay }}"
set -g display-panes-active-colour "#{{ p.accent }}"

set -g message-style "bg=#{{ p.surface0 }},fg=#{{ p.fg }}"
set -g message-command-style "bg=#{{ p.surface0 }},fg=#{{ p.fg }}"
set -g mode-style "bg=#{{ p.surface2 }},fg=#{{ p.fg }}"
set -g copy-mode-match-style "bg=#{{ p.surface1 }},fg=#{{ p.fg }}"
set -g copy-mode-current-match-style "bg=#{{ p.accent }},fg=#{{ p.bg_dark }}"
set -g clock-mode-colour "#{{ p.accent }}"
