# Every theme setting and its default. A theme file in this folder only lists what it changes;
# `theme` deep-merges it over this file. Colours are bare hex (no '#').
name = "Unnamed"
# Folder in ~/Pictures/Wallpapers with an image per monitor role, named after the role
# (Primary.jpg, Secondary.jpg, Tertiary.jpg). Empty: a gradient is generated from the palette.
wallpapers = ""

# Which screen has which wallpaper role, as hyprpaper selectors (output name or desc:...,
# matching land/monitors.lua). Any other screen gets Primary.
[monitors]
primary = "eDP-1"                                            # laptop panel
secondary = "desc:Microstep MSI MAG 27C6X CE0M035805785"     # middle, landscape
tertiary = "desc:Dell Inc. DELL U2419H 8M8RT83"              # right, portrait

[look]
font = "JetBrainsMono Nerd Font"
font_size = 12          # notifications, menus
bar_font_size = 14
term_font_size = 14
term_opacity = 0.9
gaps_in = 5
gaps_out = 12
border_size = 2
border = ["accent", "accent2"]   # palette roles for the active-border gradient
border_angle = 45
inactive_border = "surface1"
rounding = 8            # windows
ui_rounding = 10        # bar, menus, notifications, lock screen
blur = true
shadow = true
animations = "smooth"   # smooth | bouncy | none
tiling = "dwindle"      # dwindle | master
color_scheme = "prefer-dark"     # GTK: prefer-dark | prefer-light | default
icon_folders = "blue"   # Papirus folder colour: blue violet nordic orange indigo teal …

[layout]
waybar = "pills"        # layouts/waybar/<name>.jsonc + .css

# Per-app choices that are names rather than colours.
[apps]
nvim = "habamax"        # Neovim colourscheme (plugin listed in ~/.config/nvim/lua/plugins/theme.lua)

# Required palette roles (every theme defines all of them):
#   bg bg_alt bg_dark surface0 surface1 surface2 overlay subtext fg
#   red orange yellow green teal cyan blue purple pink accent accent2
[palette]

# Optional terminal overrides. Unset keys are derived from the palette:
#   black=surface1 red green yellow blue magenta=purple cyan=teal white=subtext
#   bright_black=surface2 bright_white=fg cursor=fg
[terminal]
