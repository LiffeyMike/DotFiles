name = "Rosé Pine"
wallpapers = "RosePine"

# Muted rose, gold and pine on a dusky purple; soft and warm.
[look]
icon_folders = "violet"
rounding = 12
ui_rounding = 14
gaps_in = 6
gaps_out = 16
border = ["accent", "accent2"]
animations = "smooth"
term_opacity = 0.88

[apps]
nvim = "rose-pine-main"

[palette]
bg = "191724"
bg_alt = "1f1d2e"
bg_dark = "13111e"
surface0 = "26233a"
surface1 = "403d52"
surface2 = "524f67"
overlay = "6e6a86"
subtext = "908caa"
fg = "e0def4"
red = "eb6f92"
orange = "ebbcba"
yellow = "f6c177"
green = "c4a7e7"  # iris: Rosé Pine has no green, and foam is taken by teal (battery)
teal = "9ccfd8"  # foam: pine is too dark for waybar pill text
cyan = "9ccfd8"
blue = "9ccfd8"  # foam, like teal: pine is too dark for waybar pill text
purple = "c4a7e7"
pink = "ebbcba"
accent = "ebbcba"
accent2 = "c4a7e7"

# Rosé Pine's own terminal mapping.
[terminal]
black = "26233a"
green = "31748f"
blue = "9ccfd8"
magenta = "c4a7e7"
cyan = "ebbcba"
white = "e0def4"

[layout]
waybar = "islands"
