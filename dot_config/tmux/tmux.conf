set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g default-terminal "screen-256color"

bind C-b send-prefix

unbind x
bind x kill-pane

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'

# Before tpm: tmux-continuum saves by appending an invisible command to status-right, so
# setting status-right after the plugins load would silently stop its auto-save.
set -g status-right ''
set -g @resurrect-capture-pane-contents 'on'
# Restart Neovim flagged as a restore so it reloads its persistence.nvim session (open files,
# splits); `*` is replaced by the original arguments. See ~/.config/nvim/lua/config/session.lua.
set -g @resurrect-processes '"~nvim->NVIM_RESTORE=1 nvim *"'

run '~/.config/tmux/plugins/tpm/tpm'

set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

set -g @continuum-restore 'on'
# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %


# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Colours come from the active theme (`theme`); kept last so they win over plugin defaults.
source-file -q ~/.local/state/theme/current/tmux.conf
