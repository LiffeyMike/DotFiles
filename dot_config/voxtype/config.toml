# Voxtype user config. Defaults and docs: /etc/voxtype/config.toml
# Recording is driven by Hyprland binds (hypr/land/binds.lua) via
# `voxtype record toggle`, so voxtype's own evdev hotkey stays off.

engine = "parakeet"

[hotkey]
enabled = false

[parakeet]
model = "parakeet-tdt-0.6b-v3-int8"
model_type = "tdt"

[output]
mode = "type"

[output.notification]
on_recording_start = true
on_recording_stop = false
on_transcription = false
