# Bluetooth audio is headphones only: the USB mic (Anua CM 900) does input.
# Dropping the HSP/HFP roles leaves only A2DP, so headphones never fall into
# the mono 16 kHz headset profile when an app opens a mic.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
