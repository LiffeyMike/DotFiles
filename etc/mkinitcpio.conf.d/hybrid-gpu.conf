# Managed by chezmoi (etc/). Appended after /etc/mkinitcpio.conf, so this MODULES wins.
# Only the Intel iGPU in the initramfs: it drives every display, and the NVIDIA modules load
# later from the root fs. With nvidia in the initramfs, resuming from hibernation fails: the
# boot kernel can't freeze the already-loaded nvidia driver ("pci_pm_freeze returns -5"), so
# the kernel abandons the image and boots fresh.
MODULES=(i915)
